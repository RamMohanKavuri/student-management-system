<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Management System</title>


    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f5f5f5;
        }


        h1 {
            text-align: center;
            color: #333;
        }


        h2 {
            color: #333;
        }


        .form-container {
            background: white;
            padding: 20px;
            margin-bottom: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }


        input {
            padding: 10px;
            margin: 5px;
            width: 200px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }


        button {
            padding: 10px 15px;
            margin: 5px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
        }


        .add-btn {
            background-color: green;
            color: white;
        }


        .refresh-btn {
            background-color: #007bff;
            color: white;
        }


        .delete-btn {
            background-color: red;
            color: white;
        }


        button:hover {
            opacity: 0.8;
        }


        table {
            width: 100%;
            background: white;
            border-collapse: collapse;
        }

        th {


        tr:nth-child(even) {
            background-color: #f2f2f2;
        }


        #message {
            margin: 15px 0;
            font-weight: bold;
        }
            color: green;
        }


        .error {
            color: red;
        }


        .loading {
            color: #007bff;
        }

    </style>

</head>


<body>


    <h1>Student Management System</h1>


    <!-- ========================= -->
    <!-- ADD STUDENT FORM -->
    <!-- ========================= -->

    <div class="form-container">

        <h2>Add Student</h2>


        <input
            type="text"
            id="name"
            placeholder="Enter student name"
        >


        <input
            type="text"
            id="course"
            placeholder="Enter course"
        >


        <button
            class="add-btn"
            onclick="addStudent()"
        >
            Add Student
        </button>


        <button
            class="refresh-btn"
            onclick="getStudents()"
        >
            Refresh
        </button>


        <div id="message"></div>

    </div>


    <!-- ========================= -->
    <!-- STUDENT TABLE -->
    <!-- ========================= -->

    <h2>Students List</h2>


    <table>

        <thead>

            <tr>

                <th>Student ID</th>

                <th>Name</th>

                <th>Course</th>

                <th>Action</th>

            </tr>

        </thead>


        <tbody id="studentTable">

            <tr>

                <td colspan="4">
                    Loading students...
                </td>

            </tr>

        </tbody>

    </table>


    <script>


        // =========================================
        // API GATEWAY URL
        // =========================================

        const API_URL =
        "https://e33xekw5v2.execute-api.eu-west-1.amazonaws.com/prod";


        // =========================================
        // MESSAGE FUNCTION
        // =========================================

        function showMessage(message, type) {

            const messageElement =
                document.getElementById("message");

            messageElement.innerText = message;

            messageElement.className = type;

        }


        // =========================================
        // GET ALL STUDENTS
        // =========================================

        async function getStudents() {

            const table =
                document.getElementById("studentTable");


            table.innerHTML = `
                <tr>
                    <td colspan="4">
                        Loading students...
                    </td>
                </tr>
            `;


            try {

                console.log("GET request started");


                const response = await fetch(API_URL, {

                    method: "GET"

                });


                console.log(
                    "GET HTTP status:",
                    response.status
                );


                const data = await response.json();


                console.log(
                    "GET response:",
                    data
                );


                if (!response.ok) {

                    throw new Error(
                        data.message || "Failed to retrieve students"
                    );

                }


                table.innerHTML = "";


                if (
                    !data.students ||
                    data.students.length === 0
                ) {

                    table.innerHTML = `
                        <tr>
                            <td colspan="4">
                                No students found
                            </td>
                        </tr>
                    `;

                    return;

                }


                data.students.forEach(student => {


                    const row =
                        document.createElement("tr");


                    row.innerHTML = `

                        <td>
                            ${student.studentId}
                        </td>

                        <td>
                            ${student.name}
                        </td>

                        <td>
                            ${student.course}
                        </td>

                        <td>

                            <button
                                class="delete-btn"
                                onclick="deleteStudent('${student.studentId}')"
                            >
                                Delete
                            </button>

                        </td>

                    `;


                    table.appendChild(row);

                });


            } catch (error) {

                console.error(
                    "GET ERROR:",
                    error
                );


                table.innerHTML = `
                    <tr>
                        <td colspan="4">
                            Failed to load students
                        </td>
                    </tr>
                `;


                showMessage(
                    "Error retrieving students: " +
                    error.message,
                    "error"
                );

            }

        }


        // =========================================
        // ADD STUDENT
        // =========================================

        async function addStudent() {


            const name =
                document
                .getElementById("name")
                .value
                .trim();


            const course =
                document
                .getElementById("course")
                .value
                .trim();


            // Validate input

            if (!name || !course) {

                showMessage(
                    "Please enter name and course",
                    "error"
                );

                return;

            }


            try {


                showMessage(
                    "Adding student...",
                    "loading"
                );


                console.log(
                    "POST request started"
                );


                const response = await fetch(
                    API_URL,
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body: JSON.stringify({

                            name: name,

                            course: course

                        })

                    }
                );


                console.log(
                    "POST HTTP status:",
                    response.status
                );


                const data =
                    await response.json();


                console.log(
                    "POST response:",
                    data
                );


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Failed to add student"
                    );

                }


                // Clear input fields

                document
                    .getElementById("name")
                    .value = "";


                document
                    .getElementById("course")
                    .value = "";


                showMessage(
                    "Student added successfully!",
                    "success"
                );


                // Refresh table

                getStudents();


            } catch (error) {


                console.error(
                    "POST ERROR:",
                    error
                );


                showMessage(
                    "Error adding student: " +
                    error.message,
                    "error"
                );

            }

        }


        // =========================================
        // DELETE STUDENT
        // =========================================

        async function deleteStudent(studentId) {


            const confirmDelete =
                confirm(
                    "Are you sure you want to delete this student?"
                );


            if (!confirmDelete) {

                return;

            }


            try {


                showMessage(
                    "Deleting student...",
                    "loading"
                );


                console.log(
                    "DELETE student:",
                    studentId
                );


                const response =
                    await fetch(

                        API_URL +
                        "?studentId=" +
                        encodeURIComponent(studentId),

                        {

                            method: "DELETE"

                        }

                    );


                console.log(
                    "DELETE HTTP status:",
                    response.status
                );


                const data =
                    await response.json();


                console.log(
                    "DELETE response:",
                    data
                );


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Failed to delete student"
                    );

                }


                showMessage(
                    "Student deleted successfully!",
                    "success"
                );


                // Refresh table

                getStudents();


            } catch (error) {


                console.error(
                    "DELETE ERROR:",
                    error
                );


                showMessage(
                    "Error deleting student: " +
                    error.message,
                    "error"
                );

            }

        }


        // =========================================
        // LOAD STUDENTS WHEN PAGE OPENS
        // =========================================

        window.onload = function() {

            getStudents();

        };


    </script>


</body>

</html>
